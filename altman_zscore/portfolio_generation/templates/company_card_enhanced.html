<div class="company-card">
    <div class="company-header">
        <div class="company-logo-container">
            $logo_html
            <span class="company-ticker">$ticker</span>
        </div>
        <div class="company-name">
            <h3>$company_name</h3>
        </div>
    </div>

    <div class="company-metrics">
        <div class="metric">
            <span class="metric-name">Z-Score</span>
            <span class="metric-value">$z_score</span>
        </div>
        <div class="metric">
            <span class="metric-name">Market Cap</span>
            <span class="metric-value">$market_cap</span>
        </div>
        <div class="metric">
            <span class="metric-name">Industry</span>
            <span class="metric-value">$industry</span>
        </div>
        <div class="metric">
            <span class="metric-name">Price</span>
            <span class="metric-value">$price</span>
        </div>
        <div class="metric">
            <span class="metric-name">Revenue Growth</span>
            <span class="metric-value">$revenue_growth</span>
        </div>
        <div class="metric">
            <span class="metric-name">Debt/Equity</span>
            <span class="metric-value">$debt_equity</span>
        </div>
    </div>

    <div class="z-score $risk_category">
        <strong>$risk_label</strong>
        <br>
        <small>Z-Score: $z_score</small>
    </div>
</div>
